<script>
    document.querySelectorAll('.type').forEach(type => {
        type.addEventListener('mouseenter', () => {
            type.style.backdropFilter = 'none'
            type.style.transform = 'scale(1)';
            type.style.boxShadow = '0 0 20px rgba(0, 0, 0, 0.5)';
            type.style.transition = 'all 0.8s ease';
        })

        type.addEventListener('mouseleave', () => {
            type.style.backdropFilter = 'blur(10px)'
            type.style.transform = 'scale(0.95)';
            type.style.boxShadow = 'none';
        })
    })

    document.querySelectorAll('details').forEach(detail => {
        const summary = detail.querySelector('summary');
        const content = summary.nextElementSibling;

        // 内容包裹层
        const wrapper = document.createElement('div');
        wrapper.style.overflow = 'hidden';
        while (content.firstChild) wrapper.appendChild(content.firstChild);
        content.appendChild(wrapper);

        content.style.overflow = 'hidden';
        content.style.display = 'grid';
        content.style.gridTemplateRows = '0fr';

        let animationId = null;
        let currentHeight = 0;

        function animateTo(targetHeight) {
            if (animationId) cancelAnimationFrame(animationId);

            const startHeight = currentHeight;
            const startTime = performance.now();
            const duration = 500;

            function step(now) {
                const elapsed = now - startTime;
                const progress = Math.min(elapsed / duration, 1);
                currentHeight = startHeight + (targetHeight - startHeight) * progress;
                content.style.gridTemplateRows = currentHeight + 'px';

                if (progress < 1) {
                    animationId = requestAnimationFrame(step);
                } else {
                    animationId = null;
                    if (targetHeight === 0) {
                        detail.open = false;
                        content.style.gridTemplateRows = '0fr';
                    } else {
                        content.style.gridTemplateRows = '1fr';
                    }
                    currentHeight = targetHeight;
                }
            }

            animationId = requestAnimationFrame(step);
        }

        summary.addEventListener('click', (e) => {
            if (detail.open) if (e.target.closest('a')) return;
            e.preventDefault();

            if (detail.open) {
                const real = wrapper.scrollHeight;
                currentHeight = real;
                content.style.gridTemplateRows = real + 'px';
                animateTo(0);
            } else {
                detail.open = true;
                content.style.gridTemplateRows = '0fr';
                requestAnimationFrame(() => {
                    const real = wrapper.scrollHeight;
                    currentHeight = 0;
                    content.style.gridTemplateRows = '0px';
                    animateTo(real);
                });
            }
        });
    });

</script>

</body>
</html>
